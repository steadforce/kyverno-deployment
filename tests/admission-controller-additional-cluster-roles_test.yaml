suite: kyverno admission controller cluster roles per cluster
release:
  name: kyverno
templates:
- charts/kyverno/templates/admission-controller/clusterrole.yaml
tests:
- it: omits secrets from the core cluster role on non-local clusters
  values: &subchartOverrideValues
  - ../values-subchart-overrides.yaml
  asserts:
  - notExists:
      path: &secretResourcePathExpression rules[*].resources[?(@ == 'secrets')]
    documentSelector: &admissionControllerCoreSelector
      path: metadata.name
      value: kyverno:admission-controller:core
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on local clusters
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - notExists:
      path: *secretResourcePathExpression
    documentSelector: *admissionControllerCoreSelector
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on production clusters
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - notExists:
      path: *secretResourcePathExpression
    documentSelector: *admissionControllerCoreSelector
  - matchSnapshot: {}
- it: grants read access in the additional cluster role on non-local clusters
  values: *subchartOverrideValues
  asserts:
  - equal:
      path: rules
      value:
      - apiGroups:
        - ''
        resources:
        - secrets
        verbs:
        - get
        - list
      - apiGroups:
        - acid.zalan.do
        resources:
        - postgresqls
        verbs:
        - get
        - list
      - apiGroups:
        - networking.istio.io
        resources:
        - sidecars
        verbs:
        - get
        - list
      - apiGroups:
        - rbac.authorization.k8s.io
        resources:
        - rolebindings
        verbs:
        - get
        - list
      - apiGroups:
        - security.istio.io
        resources:
        - peerauthentications
        verbs:
        - get
        - list
    documentSelector:
      path: metadata.name
      value: kyverno:admission-controller:additional
  - matchSnapshot: {}
- it: uses the rbac.authorization.k8s.io/v1 api version on non-local clusters
  values: *subchartOverrideValues
  asserts:
  - containsDocument:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
  - matchSnapshot: {}
