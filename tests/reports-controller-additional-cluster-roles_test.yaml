suite: kyverno reports controller cluster roles per cluster
release:
  name: kyverno
templates:
- charts/kyverno/templates/reports-controller/clusterrole.yaml
tests:
- it: omits secrets from the core cluster role on non-local clusters
  values: &subchartOverrideValues
  - ../values-subchart-overrides.yaml
  asserts:
  - notExists:
      path: &secretResourcePathExpression rules[*].resources[?(@ == 'secrets')]
    documentSelector: &reportsControllerCoreSelector
      path: metadata.name
      value: kyverno:reports-controller:core
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on local clusters
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - notExists:
      path: *secretResourcePathExpression
    documentSelector: *reportsControllerCoreSelector
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on production clusters
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - notExists:
      path: *secretResourcePathExpression
    documentSelector: *reportsControllerCoreSelector
  - matchSnapshot: {}
- it: uses the rbac.authorization.k8s.io/v1 api version on non-local clusters
  values: *subchartOverrideValues
  asserts:
  - containsDocument:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
  - matchSnapshot: {}
