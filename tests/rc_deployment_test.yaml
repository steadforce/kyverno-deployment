suite: "test deployment for kyverno reports controller"
release:
  name: kyverno
templates:
- charts/kyverno/templates/reports-controller/deployment.yaml
tests:
- it: sets zero cpu and memory requests on the controller container on local clusters
  values: &localValues
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].resources.limits.cpu
      pattern: "^0.*"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].resources.limits.memory
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].resources.requests.cpu
      pattern: "^0.*"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].resources.requests.memory
      pattern: "^0.*"
  - matchSnapshot:
      path: spec.template.spec
- it: keeps non-zero controller container resources on non-local clusters
  values: &overridesValues
  - ../values-subchart-overrides.yaml
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].resources.limits.cpu
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].resources.limits.memory
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].resources.requests.cpu
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].resources.requests.memory
      pattern: "^[1-9].*"
  - matchSnapshot:
      path: spec.template.spec
- it: enables policy exceptions on non-local clusters
  values: *overridesValues
  asserts:
  - contains:
      path: &kyvernoContainerArgsPath spec.template.spec.containers[?(@.name == "controller")].args
      content:
        --enablePolicyException=true
  - matchSnapshot:
      path: spec.template.spec
- it: disables policy exceptions with subchart defaults
  asserts:
  - contains:
      path: *kyvernoContainerArgsPath
      content:
        --enablePolicyException=false
  - matchSnapshot:
      path: spec.template.spec
- it: sets log verbosity 3 on local clusters
  values: *localValues
  asserts:
  - contains:
      path: *kyvernoContainerArgsPath
      content:
        --v=3
  - matchSnapshot:
      path: spec.template.spec
- it: sets log verbosity -1 on non-local clusters
  values: *overridesValues
  asserts: &assertLoggingCustomVerbosity
  - contains:
      path: *kyvernoContainerArgsPath
      content:
        --v=-1
  - matchSnapshot:
      path: spec.template.spec
- it: sets log verbosity -1 on production clusters
  values: &productionValues
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts: *assertLoggingCustomVerbosity
- it: uses log verbosity 2 with subchart defaults
  asserts:
  - contains:
      path: *kyvernoContainerArgsPath
      content:
        --v=2
  - matchSnapshot:
      path: spec.template.spec
- it: uses the text log format with subchart defaults
  asserts: &assertLoggingTextFormat
  - contains:
      path: *kyvernoContainerArgsPath
      content:
        --loggingFormat=text
  - matchSnapshot:
      path: spec.template.spec
- it: uses the text log format on local clusters
  values: *localValues
  asserts: *assertLoggingTextFormat
- it: uses the text log format on non-local clusters
  values: *overridesValues
  asserts: *assertLoggingTextFormat
- it: uses the text log format on production clusters
  values: *productionValues
  asserts: *assertLoggingTextFormat
- it: runs three replicas on non-local clusters
  values: *overridesValues
  asserts:
  - equal:
      path: spec.replicas
      value: 3
- it: runs three replicas on production clusters
  values: *productionValues
  asserts:
  - equal:
      path: spec.replicas
      value: 3
- it: runs one replica on local clusters
  values: *localValues
  asserts:
  - equal:
      path: spec.replicas
      value: 1
- it: disables admission reports
  values: *overridesValues
  asserts:
  - contains:
      path: *kyvernoContainerArgsPath
      content: --admissionReports=false
- it: allows policy exceptions in all namespaces
  values: *overridesValues
  asserts:
  - contains:
      path: *kyvernoContainerArgsPath
      content: --exceptionNamespace=*
