suite: kyverno disallow-latest-tag ClusterPolicy per cluster
release:
  name: kyverno
templates:
- disallow-latest-tag.yaml
capabilities:
  apiVersions:
  - kyverno.io/v1
values:
- ../values-subchart-overrides.yaml
tests:
- it: sets the policy to enforce on default clusters
  asserts:
  - equal: &validationFailureActionPathEnforce
      path: spec.validationFailureAction
      value: enforce
  - matchSnapshot: {}
- it: sets the policy to audit on local clusters
  values:
  - ../values-local.yaml
  asserts:
  - equal: &validationFailureActionPathAudit
      path: spec.validationFailureAction
      value: audit
  - matchSnapshot: {}
- it: sets the policy to audit on production clusters
  values:
  - ../values-production.yaml
  asserts:
  - equal: *validationFailureActionPathAudit
  - matchSnapshot: {}
- it: sets the policy to enforce on the sf-k8s04-dev cluster
  values:
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - equal: *validationFailureActionPathEnforce
  - matchSnapshot: {}
