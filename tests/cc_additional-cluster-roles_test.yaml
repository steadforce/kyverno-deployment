suite: "test additional cluster roles for kyverno cleanup controller"
release:
  name: kyverno
templates:
- charts/kyverno/templates/cleanup-controller/clusterrole.yaml
tests:
- it: omits secrets from the core cluster role on non-local clusters
  values: &valuesSubchartOverrides
  - ../values-subchart-overrides.yaml
  asserts:
  - notExists: &secretRules
      path: rules[*].resources[?(@ == 'secrets')]
    documentSelector: &cleanupControllerCore
      path: metadata.name
      value: kyverno:cleanup-controller:core
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on local clusters
  values: &valuesFullClusters
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - notExists: *secretRules
    documentSelector: *cleanupControllerCore
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on production clusters
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - notExists: *secretRules
    documentSelector: *cleanupControllerCore
  - matchSnapshot: {}
- it: grants job deletion in the additional cluster role on local clusters
  values: *valuesFullClusters
  asserts:
  - contains:
      path: rules
      content:
        apiGroups:
        - batch
        - extensions
        resources:
        - jobs
        verbs:
        - delete
        - get
        - list
    documentSelector:
      path: metadata.name
      value: kyverno:cleanup-controller:additional
  - matchSnapshot: {}
- it: uses the rbac.authorization.k8s.io/v1 api version on non-local clusters
  values: *valuesSubchartOverrides
  asserts:
  - containsDocument:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
  - matchSnapshot: {}
