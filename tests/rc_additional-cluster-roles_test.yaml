suite: "test additional cluster roles for kyverno reports controller"
release:
  name: kyverno
templates:
- charts/kyverno/templates/reports-controller/clusterrole.yaml
tests:
- it: omits secrets from the core cluster role on non-local clusters
  values: &valuesSubchartOverrides
  - ../values-subchart-overrides.yaml
  asserts:
  - notExists: &secretRules
      path: rules[*].resources[?(@ == 'secrets')]
    documentSelector: &reportsControllerCore
      path: metadata.name
      value: kyverno:reports-controller:core
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on local clusters
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - notExists: *secretRules
    documentSelector: *reportsControllerCore
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on production clusters
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - notExists: *secretRules
    documentSelector: *reportsControllerCore
  - matchSnapshot: {}
- it: uses the rbac.authorization.k8s.io/v1 api version on non-local clusters
  values: *valuesSubchartOverrides
  asserts:
  - containsDocument:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
  - matchSnapshot: {}
