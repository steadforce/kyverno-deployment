suite: kyverno controller images
release:
  name: kyverno
tests:
- it: pulls the admission controller image directly from ghcr.io and not from the reg.kyverno.io gateway
  template: charts/kyverno/templates/admission-controller/deployment.yaml
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "kyverno")].image
      pattern: "^ghcr\\.io/kyverno/kyverno:v[0-9.]+$"
- it: pulls the background controller image directly from ghcr.io and not from the reg.kyverno.io gateway
  template: charts/kyverno/templates/background-controller/deployment.yaml
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].image
      pattern: "^ghcr\\.io/kyverno/background-controller:v[0-9.]+$"
- it: pulls the cleanup controller image directly from ghcr.io and not from the reg.kyverno.io gateway
  template: charts/kyverno/templates/cleanup-controller/deployment.yaml
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].image
      pattern: "^ghcr\\.io/kyverno/cleanup-controller:v[0-9.]+$"
- it: pulls the reports controller image directly from ghcr.io and not from the reg.kyverno.io gateway
  template: charts/kyverno/templates/reports-controller/deployment.yaml
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "controller")].image
      pattern: "^ghcr\\.io/kyverno/reports-controller:v[0-9.]+$"
- it: pulls the kyverno-pre init container of the admission controller from ghcr.io too, without it the admission controller does not start
  template: charts/kyverno/templates/admission-controller/deployment.yaml
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - matchRegex:
      path: spec.template.spec.initContainers[?(@.name == "kyverno-pre")].image
      pattern: "^ghcr\\.io/kyverno/kyvernopre:v[0-9.]+$"
