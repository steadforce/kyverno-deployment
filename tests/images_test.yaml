suite: kyverno controller images
release:
  name: kyverno
templates:
- charts/kyverno/templates/admission-controller/deployment.yaml
- charts/kyverno/templates/background-controller/deployment.yaml
- charts/kyverno/templates/cleanup-controller/deployment.yaml
- charts/kyverno/templates/reports-controller/deployment.yaml
tests:
- it: pulls every controller image directly from ghcr.io and not from the reg.kyverno.io gateway
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].image
      pattern: "^ghcr\\.io/kyverno/[a-z-]+:v[0-9.]+$"
