suite: kyverno background controller cluster roles per cluster
release:
  name: kyverno
templates:
- charts/kyverno/templates/background-controller/clusterrole.yaml
tests:
- it: omits secrets from the core cluster role on non-local clusters
  values: &subchartOverrideValues
  - ../values-subchart-overrides.yaml
  asserts:
  - notExists:
      path: &secretResourcePathExpression rules[*].resources[?(@ == 'secrets')]
    documentSelector: &backgroundControllerCoreSelector
      path: metadata.name
      value: kyverno:background-controller:core
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on local clusters
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - notExists:
      path: *secretResourcePathExpression
    documentSelector: *backgroundControllerCoreSelector
  - matchSnapshot: {}
- it: omits secrets from the core cluster role on production clusters
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - notExists:
      path: *secretResourcePathExpression
    documentSelector: *backgroundControllerCoreSelector
  - matchSnapshot: {}
- it: grants write access in the additional cluster role on non-local clusters
  values: *subchartOverrideValues
  asserts:
  - equal:
      path: rules
      value:
      - apiGroups:
        - ''
        resources:
        - secrets
        verbs:
        - create
        - delete
        - get
        - list
        - update
      - apiGroups:
          - acid.zalan.do
        resources:
          - postgresqls
        verbs:
          - get
          - list
      - apiGroups:
          - cert-manager.io
        resources:
          - issuers
        verbs:
          - create
          - delete
          - get
          - list
          - update
      - apiGroups:
          - networking.istio.io
        resources:
          - sidecars
        verbs:
          - create
          - delete
          - get
          - list
          - update
      - apiGroups:
        - rbac.authorization.k8s.io
        resources:
        - rolebindings
        verbs:
          - create
          - delete
          - get
          - list
          - update
      - apiGroups:
          - security.istio.io
        resources:
          - peerauthentications
        verbs:
          - create
          - delete
          - get
          - list
          - update
    documentSelector:
      path: metadata.name
      value: kyverno:background-controller:additional
  - matchSnapshot: {}
- it: uses the rbac.authorization.k8s.io/v1 api version on non-local clusters
  values: *subchartOverrideValues
  asserts:
  - containsDocument:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
  - matchSnapshot: {}
