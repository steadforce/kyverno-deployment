# Configuration file used by the pipeline hydration step
# to render the manifests for the different environments
releaseName: &name kyverno
namespace: *name
environments:
  local:
    apis: &apis
    - batch/v1
    - cert-manager.io/v1
    - grafana.integreatly.org/v1beta1 # grafana operator not yet installed in cluster, yet it is referenced in the chart
    - kyverno.io/v1
    - kyverno.io/v2
    - kyverno.io/v2alpha1
    - kyverno.io/v2beta1
    - monitoring.coreos.com/v1
    - openreports.io/v1alpha1
    - policies.kyverno.io/v1
    - reports.kyverno.io/v1
    - wgpolicyk8s.io/v1alpha2
    valueFiles:
    - values-subchart-overrides.yaml
    - values-local.yaml
  sf-k8s01-dev:
    apis: *apis
    valueFiles: &devValues
    - values-subchart-overrides.yaml
    - values-development.yaml
  sf-k8s02-dev:
    apis: *apis
    valueFiles: *devValues
  sf-k8s01-prod:
    apis: *apis
    valueFiles:
    - values-subchart-overrides.yaml
    - values-production.yaml
