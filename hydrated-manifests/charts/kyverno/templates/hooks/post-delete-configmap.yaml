# Source: kyverno/charts/kyverno/templates/hooks/post-delete-configmap.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: kyverno-remove-configmap
  namespace: kyverno
  labels:
    app.kubernetes.io/component: hooks
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/version: 3.3.7
    helm.sh/chart: kyverno-3.3.7
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    helm.sh/hook-weight: "10"
spec:
  backoffLimit: 2
  template:
    metadata:
    spec:
      serviceAccount: kyverno-remove-configmap
      restartPolicy: Never
      containers:
        - name: kubectl
          image: "bitnamilegacy/kubectl:1.30.2"
          imagePullPolicy:
          command:
            - /bin/bash
            - '-c'
            - |-
              set -euo pipefail
              kubectl delete cm -n kyverno kyverno
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
